<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilt Math Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">

</head>
<body>
    <h1>Quilt Math Calculator</h1>
    <p>Enter your numbers, get your answers. No more seam-allowance headaches.</p>

    <div class="calc">
        <h2>Quilt Size</h2>
        <label>Blocks across <input type="number" id="blocks-across" value="4" min="1"></label>
        <label>Blocks down <input type="number" id="blocks-down" value="4" min="1"></label>
        <label>Finished block width (in) <input type="number" id="block-width" value="12" min="1" step="0.5"></label>
        <label>Finished block height (in) <input type="number" id="block-height" value="12" min="1" step="0.5"></label>
        <p class="result" id="size-result"></p>
    </div>

    <div class="calc">
        <h2>Cutting Size</h2>
        <label>Finished patch size (in) <input type="number" id="finished-size" value="2" min="0.5" step="0.25"></label>
        <p class="result" id="cutting-result"></p>
    </div>

    <div class="calc">
        <h2>Backing Yardage</h2>
        <label>Quilt width (in) <input type="number" id="quilt-width" value="48" min="1"></label>
        <label>Quilt length (in) <input type="number" id="quilt-length" value="48" min="1"></label>
        <p class="result" id="backing-result"></p>
    </div>

    <script>
        function updateSize() {
        const across = Number(document.getElementById('blocks-across').value);
        const down = Number(document.getElementById('blocks-down').value);
        const bWidth = Number(document.getElementById('block-width').value);
        const bHeight = Number(document.getElementById('block-height').value);
        const width = across * bWidth;
        const length = down * bHeight;
        document.getElementById('size-result').textContent =
            `Quilt top: ${width}" x ${length}"`;
    }

    function updateCutting() {
        const finished = Number(document.getElementById('finished-size').value);
        const cut = finished + 0.5;
        document.getElementById('cutting-result').textContent =
            `Cut: ${cut}" x ${cut}" squares`;
    }

    function updateBacking() {
        const w = Number(document.getElementById('quilt-width').value);
        const l = Number(document.getElementById('quilt-length').value);
        const needW = w + 8;
        const needL = l + 8;
        const panels = Math.ceil(needW / 44);
        const yards = (panels * needL / 36).toFixed(2);
        const word = panels === 1 ? 'panel' : 'panels';
        document.getElementById('backing-result').textContent =
            `Backing: ${needW}" x ${needL}" — buy ${yards} yards (${panels} ${word} of 44" fabric)`;
    }

    ['blocks-across', 'blocks-down', 'block-width', 'block-height'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', updateSize);
    });
    document.getElementById('finished-size').addEventListener('input', updateCutting);
    ['quilt-width', 'quilt-length'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', updateBacking);
    });

    updateSize();
    updateCutting();
    updateBacking();

    </script>
</body>
</html>
